name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate CI shell helpers
        run: sh -n scripts/ci/wait-for-android-package-manager.sh

      # The official wrapper is checksum-validated before any Gradle task runs.
      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest processDebugAndroidTestManifest compileDebugAndroidTestKotlin assembleDebug --no-configuration-cache --stacktrace --build-cache

      - name: Verify Compose instrumentation host manifest
        shell: bash
        run: |
          mapfile -t manifests < <(find app/build/intermediates -type f -name AndroidManifest.xml -path '*debugAndroidTest*')
          if (( ${#manifests[@]} == 0 )); then
            echo "::error::No merged debugAndroidTest manifest was generated."
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            if grep -q 'androidx.activity.ComponentActivity' "$manifest"; then
              echo "Compose test host is declared in $manifest"
              exit 0
            fi
          done

          echo "::error::androidx.activity.ComponentActivity is missing from the merged instrumentation manifest."
          printf '%s\\n' "${manifests[@]}"
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: a-syria-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  instrumentation-tests:
    name: Instrumentation tests (Android ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '33'
          - api-level: '36'
          - api-level: '37.0'
            disk-size: '8192M'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: ${{ matrix.disk-size }}
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -wipe-data -gpu swiftshader_indirect -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: 'sh scripts/ci/wait-for-android-package-manager.sh && adb -s "${ANDROID_SERIAL:-emulator-5554}" shell df -h /data && adb -s "${ANDROID_SERIAL:-emulator-5554}" shell getprop ro.build.version.sdk && adb -s "${ANDROID_SERIAL:-emulator-5554}" shell getprop ro.product.cpu.abilist && ./gradlew connectedDebugAndroidTest --no-configuration-cache --stacktrace --build-cache'
