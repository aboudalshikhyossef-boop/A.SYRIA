name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      # The official wrapper is checksum-validated before any Gradle task runs.
      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --no-configuration-cache --stacktrace --build-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: a-syria-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  instrumentation-tests:
    name: Instrumentation tests (Android ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    strategy:
      fail-fast: false
      matrix:
        api-level: ['33', '36', '37.0']
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -wipe-data -gpu swiftshader_indirect -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -eu

            emulator_serial="${ANDROID_SERIAL:-emulator-5554}"
            adb devices -l
            adb -s "$emulator_serial" wait-for-device

            wait_for_package_manager() {
              for attempt in $(seq 1 90); do
                boot_completed="$(adb -s "$emulator_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                package_probe="$(adb -s "$emulator_serial" shell cmd package list packages 2>&1 || true)"

                case "$package_probe" in
                  package:*)
                    if [ "$boot_completed" = "1" ]; then
                      echo "Android boot and Package Manager are ready."
                      return 0
                    fi
                    ;;
                esac

                echo "Waiting for Package Manager (attempt $attempt/90)."
                sleep 2
              done
              return 1
            }

            if ! wait_for_package_manager; then
              echo "::warning::Package Manager did not become ready; restarting the emulator once."
              adb -s "$emulator_serial" reboot
              adb -s "$emulator_serial" wait-for-device

              if ! wait_for_package_manager; then
                echo "::error::Android Package Manager remained unavailable after an emulator restart."
                adb -s "$emulator_serial" shell getprop init.svc.system_server || true
                adb -s "$emulator_serial" shell service check package || true
                adb -s "$emulator_serial" logcat -d -b all -v time -t 2000 | grep -Ei 'FATAL EXCEPTION|SystemServer|PackageManager|ActivityManager|OutOfMemory|watchdog' | tail -n 200 || true
                exit 1
              fi
            fi

            adb -s "$emulator_serial" shell getprop ro.build.version.sdk
            adb -s "$emulator_serial" shell getprop ro.product.cpu.abilist
            ./gradlew connectedDebugAndroidTest --no-configuration-cache --stacktrace --build-cache
