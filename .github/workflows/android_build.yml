name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Validate CI shell helpers
        run: sh -n scripts/ci/wait-for-android-package-manager.sh

      # The official wrapper is checksum-validated before any Gradle task runs.
      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest processDebugAndroidTestManifest compileDebugAndroidTestKotlin assembleDebug --no-configuration-cache --stacktrace --build-cache

      - name: Verify Compose instrumentation host manifest
        shell: bash
        run: |
          mapfile -t manifests < <(find app/build/intermediates -type f -name AndroidManifest.xml -path '*debugAndroidTest*')
          if (( ${#manifests[@]} == 0 )); then
            echo "::error::No merged debugAndroidTest manifest was generated."
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            if grep -q 'androidx.activity.ComponentActivity' "$manifest"; then
              echo "Compose test host is declared in $manifest"
              exit 0
            fi
          done

          echo "::error::androidx.activity.ComponentActivity is missing from the merged instrumentation manifest."
          printf '%s\\n' "${manifests[@]}"
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: a-syria-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  instrumentation-tests:
    name: Instrumentation tests (Android ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: '29'
            target: google_apis
          - api-level: '33'
            target: google_apis
          - api-level: '36'
            target: google_apis
          - api-level: '37.0'
            target: google_apis
            disk-size: '8192M'
            ram-size: '4096M' # Android 17 API 37 requires at least 4 GB RAM
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install pinned Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are both unset."
            exit 1
          fi

          tools_dir="$sdk_root/cmdline-tools"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          curl --fail --location --retry 3 --silent --show-error \
            --output "$temp_dir/commandline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip"

          unzip -q "$temp_dir/commandline-tools.zip" -d "$temp_dir"
          test -x "$temp_dir/cmdline-tools/bin/sdkmanager"

          mkdir -p "$tools_dir"
          rm -rf "$tools_dir/latest"
          mv "$temp_dir/cmdline-tools" "$tools_dir/latest"

          echo "$tools_dir/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "Android SDK command-line tools: $("$tools_dir/latest/bin/sdkmanager" --version)"

      # The upstream emulator action also installs the latest emulator package.
      # Preinstall it with retries so a transient/corrupt SDK archive cannot fail
      # API 37 before the emulator is even created. The action then reuses this package.
      - name: Preinstall Android Emulator (API 37) with retry
        if: matrix.api-level == '37.0'
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"

          for attempt in 1 2 3; do
            echo "Installing stable-channel Android Emulator package (attempt $attempt/3)."
            if "$sdkmanager_bin" --install emulator --channel=0; then
              emulator_dir="${ANDROID_HOME}/emulator"
              test -x "$emulator_dir/emulator"
              test -x "$emulator_dir/qemu/linux-x86_64/qemu-system-x86_64"
              "$sdkmanager_bin" --list_installed | grep -E '^[[:space:]]*emulator[[:space:]]*\|'
              echo "Android Emulator package files are present and reusable by android-emulator-runner."
              exit 0
            fi

            if (( attempt < 3 )); then
              echo "::warning::Android Emulator package download failed; retrying after a clean delay."
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Could not install the Android Emulator package after 3 attempts."
          exit 1

      # A transient/corrupt Google system-image ZIP previously caused API 33
      # to fail before the emulator was booted and before any app test ran.
      - name: Preinstall Android 33 system image with retry
        if: matrix.api-level == '33'
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          package="system-images;android-33;google_apis;x86_64"
          test -x "$sdkmanager_bin"

          for attempt in 1 2 3; do
            echo "Installing Android 33 Google APIs image (attempt $attempt/3)."
            if "$sdkmanager_bin" --install "$package" --channel=0; then
              "$sdkmanager_bin" --list_installed | grep -F "$package"
              echo "Android 33 system image is installed."
              exit 0
            fi

            if (( attempt < 3 )); then
              echo "::warning::Android 33 system-image download failed; removing partial files and retrying."
              rm -rf "${ANDROID_HOME}/system-images/android-33/google_apis/x86_64"
              rm -rf "$HOME/.android/cache"
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Android 33 system image could not be installed after 3 attempts."
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          disk-size: ${{ matrix.disk-size }}
          ram-size: ${{ matrix.ram-size }}
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -wipe-data -gpu swiftshader_indirect -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          pre-emulator-launch-script: 'grep -E "^(target|image.sysdir.1|hw.ramSize|disk.dataPartition.size)=" "$ANDROID_AVD_HOME/test.avd/config.ini"'
          script: 'sh scripts/ci/wait-for-android-package-manager.sh ./gradlew connectedDebugAndroidTest --no-configuration-cache --stacktrace --build-cache && if [ "${{ matrix.api-level }}" = "37.0" ]; then mkdir -p "$RUNNER_TEMP/design-preview" && adb wait-for-device && adb pull /sdcard/Pictures/A.SYRIA/design-system-preview.png "$RUNNER_TEMP/design-preview/design-system-preview.png" && test -s "$RUNNER_TEMP/design-preview/design-system-preview.png"; fi'

      - name: Upload design system preview screenshot
        if: matrix.api-level == '37.0'
        uses: actions/upload-artifact@v7
        with:
          name: a-syria-design-system-preview
          path: ${{ runner.temp }}/design-preview/design-system-preview.png
          retention-days: 14
          if-no-files-found: error
